# Render config (free plan). You can also create the service by hand:
# Dashboard → New → Web Service → pick this repo, then use the same settings.
# Secrets marked `sync: false` are entered in the dashboard and never stored in git.
#
# Free plan notes: the service sleeps after 15 min without traffic and its disk is
# temporary. A free external pinger hitting POST /api/autopilot/tick every 10 minutes
# keeps it awake and runs autopilot (see README → Deploy on Render).
services:
  - type: web
    name: splitpay-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/groups
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUSINESS_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_EMAIL_1
        sync: false
      - key: DEMO_EMAIL_2
        sync: false
      - key: DEMO_EMAIL_3
        sync: false
      - key: CRON_SECRET
        generateValue: true
